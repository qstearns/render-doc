[tools]
go = "latest"

[tasks.build]
description = "Build ./render-doc"
run = "go build -o render-doc ."

[tasks.test]
description = "Run the unit tests"
run = "go test ./..."

[tasks.install]
description = "Install render-doc into ~/.local/bin"
env = { GOBIN = "{{env.HOME}}/.local/bin" }
run = "go install ."
